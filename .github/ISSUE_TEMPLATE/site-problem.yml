name: Something on the site is broken
description: A page, chart, map, link or download that doesn't work or is hard to use.
title: "Site: "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: https://…/water/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: This stops me using the page with a keyboard, screen reader or other assistive technology
