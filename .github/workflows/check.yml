# Loads every page in headless Chrome at phone and desktop size, in light and dark, and
# fails on script errors, sideways scrolling, missing fonts, low contrast or unnamed
# controls (scripts/check.mjs). Also reports sources due for a new edition, without failing.
name: Check pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every page
        run: BROWSER="$(command -v google-chrome)" node scripts/check.mjs
      - name: Sources due for a new edition
        if: always()
        run: node scripts/freshness.mjs
