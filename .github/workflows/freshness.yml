# Every Monday, fails if any recurring source is overdue for a new edition, so GitHub
# emails the maintainer. The log lists which sources and where to get them
# (scripts/freshness.mjs; cadences are set in that file).
name: Source freshness

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/freshness.mjs --strict
